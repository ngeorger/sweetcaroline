name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No WORDPRESS_BASE_URL here on purpose: the content importer needs the
      # network and would make builds non-deterministic, so it is never run in
      # CI. The committed content under src/content/ is the build input.

      - name: Type check
        run: npm run check

      # Before the tests: `tests/unit/deploy.test.ts` asserts against the built
      # `dist/` (link integrity, base paths, robots/sitemap), so it needs it.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
